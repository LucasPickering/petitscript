[settings]
idiomatic_version_file_enable_tools = ["rust"] # use rust-toolchain.toml

[tasks.cli]
description = "Run a PetitScript file"
run = "cargo run -p petitscript_cli -- $usage_file"
usage = '''
arg "<file>" help="File to execute"
'''

[tasks.doc]
description = "Build docs"
run = "cargo doc -p petitscript --all-features"
sources = ["Cargo.toml", "src/**/*.rs"]
